<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Recall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d14;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #4ade80;
    }
    .status-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .status-pill.offline {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.2);
    }
    .video-card {
      background: #0d131f;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .video-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #e2e8f0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4ade80;
      margin-bottom: 10px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }
    .btn-action {
      width: 100%;
      background: #22c55e;
      color: #000;
      border: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-action:hover {
      background: #16a34a;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .not-youtube {
      padding: 24px 0;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>✨ YouTube Recall</span>
    </div>
    <span id="server-status" class="status-pill">Checking...</span>
  </div>

  <div id="active-video-view">
    <div class="video-card">
      <div id="yt-title" class="video-title">Detecting video...</div>
      <div class="auto-badge">
        <div class="pulse-dot"></div>
        <span id="auto-status-text">Auto-transcribing while you watch</span>
      </div>
    </div>

    <button id="main-btn" class="btn-action">
      <span>Open in Smart Reader</span>
    </button>
  </div>

  <div id="inactive-view" class="not-youtube" style="display: none;">
    <p>Play any YouTube video and it will automatically transcribe in the background.</p>
  </div>

  <div style="margin-top: 10px;">
    <a href="http://localhost:8000" target="_blank" class="btn-secondary">
      Open Library Dashboard →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
