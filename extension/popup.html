<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Recall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f17;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #22c55e;
    }
    .status-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .status-pill.offline {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.2);
    }
    .video-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .video-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #e2e8f0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .progress-bar-container {
      background: #1f2937;
      border-radius: 6px;
      height: 6px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
    }
    .btn-save {
      width: 100%;
      background: #22c55e;
      color: #000;
      border: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-save:hover {
      background: #16a34a;
    }
    .btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .force-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      margin-bottom: 14px;
    }
    .footer {
      border-top: 1px solid #1f2937;
      padding-top: 10px;
      text-align: center;
    }
    .dashboard-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }
    .dashboard-link:hover {
      text-decoration: underline;
    }
    .not-youtube {
      padding: 20px 0;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>✨ YouTube Smart Transcript</span>
    </div>
    <span id="server-status" class="status-pill">Checking...</span>
  </div>

  <div id="active-video-view">
    <div class="video-card">
      <div id="yt-title" class="video-title">Detecting YouTube video...</div>
      <div class="progress-bar-container">
        <div id="yt-progress" class="progress-bar"></div>
      </div>
      <div class="stats-row">
        <span id="yt-time">00:00 / 00:00</span>
        <span id="yt-pct">0% Watched</span>
      </div>
    </div>

    <button id="save-btn" class="btn-save">
      <span>✨ Transcribe & Distill</span>
    </button>

    <div class="force-row">
      <input type="checkbox" id="force-checkbox" checked>
      <label for="force-checkbox">Direct Ingest (Fast process)</label>
    </div>
  </div>

  <div id="inactive-view" class="not-youtube" style="display: none;">
    <p>Open any YouTube video to generate crisp on-to-the-point transcripts.</p>
  </div>

  <div class="footer">
    <a href="http://localhost:8000" target="_blank" class="dashboard-link">
      Open Smart Transcript Reader →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
